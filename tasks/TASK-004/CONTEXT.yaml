invariants:
  - "PostgreSQL + Flyway, schema di proprieta di Flyway"
  - "spring.jpa.hibernate.ddl-auto=validate"
  - "schema fermo a V3: nessuna migrazione nuova"
  - "archive e restore scrivono una sola riga, la propria: zero UPDATE su tasks"
  - "restore e l'inverso esatto di archive per costruzione, senza stato ricordato"
  - "al commit di un'assegnazione, ogni progetto da cui dipendeva era nello stato su cui la decisione e stata presa"
  - "un task in un progetto ARCHIVED e immutabile in scrittura e leggibile"
  - "PUT verso lo stesso progetto archiviato: 200 no-op, nessuna scrittura"
  - "ogni write path che dipende da Project.status applica il protocollo L1-L7, con acquisizione multi-riga in ordine di id crescente"
  - "le letture non prendono lock"
  - "TaskResponse identico a TASK-003: nessun campo nuovo"
  - "il protocollo serializza il progetto, non il task: due riassegnazioni concorrenti dello stesso task restano last-write-wins (TD-30)"
  - "relazione unidirezionale: nessuna @OneToMany su Project"
  - "POST /api/tasks {} -> 400 con la forma preesistente di Spring"
  - "contratto di errore limitato ai due advice di modulo"
  - "nessun H2"

lock_protocol:
  L1: "chi scrive una riga di projects prende PESSIMISTIC_WRITE (FOR UPDATE) su quella riga prima di leggerne lo stato, fino al commit"
  L2: "ogni write path la cui correttezza dipende da Project.status prende PESSIMISTIC_READ (FOR SHARE) su ogni riga da cui dipende, prima di deciderlo, fino al commit"
  L3: "creazione e assegnazione da NULL: un solo progetto, la destinazione. POST /api/tasks senza projectId: nessun lock"
  L4: "riassegnazione A -> B: FOR SHARE su entrambi, origine e destinazione. Se A == B, una riga sola"
  L5: "acquisizione multi-riga: insieme costruito, deduplicato, ordinato per id crescente, bloccato in quell'ordine, qualunque sia il ruolo"
  L6: "le letture non prendono lock"
  L7: "clausola di chiusura: il protocollo e universale, ogni write path presente o futuro che dipende da Project.status lo applica"

decisions_approved_by_human:
  - id: cascade_shape
