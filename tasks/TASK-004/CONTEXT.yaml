  - id: no_migration
    decision: "Nessuna migrazione di database. Schema fermo a V3. ADR-006 §6"
  - id: frozen_writes
    decision: "Task associato a un Project ARCHIVED congelato in scrittura. ADR-006 §2"
  - id: reads_allowed
    decision: "Letture consentite su task e progetti archiviati. ADR-006 §2"
  - id: idempotent_noop
    decision: "PUT idempotente verso lo stesso progetto archiviato: 200 no-op. ADR-006 §2"
  - id: concurrency_strategy
    decision: "Locking pessimistico sulla riga Project, formalizzato come protocollo L1-L7. ADR-006 §4"
  - id: td29_registration
    decision: "TD-29 registrato come MINOR subordinato a TD-07: riguarda solo l'assenza di un contratto API normalizzato per gli errori infrastrutturali di concorrenza e locking. Nessun timeout, retry o 503. ADR-006 §5 §7"
  - id: frozen_discoverability
    decision: "Scopribilita dello stato frozen FUORI SCOPE, definitivo. Nessun projectStatus ne campo equivalente in TaskResponse. ADR-006 §3"
  - id: task_level_concurrency_limit
    decision: "Limite dichiarato: due riassegnazioni concorrenti dello stesso task restano last-write-wins. Distinto da TD-25, che era violazione di invariante. Tracciato come TD-30 MINOR. ADR-006 §8"

