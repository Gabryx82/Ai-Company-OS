    migrazione irreversibile che il charter mette dietro una decisione
    umana. Da fare quando servira' un terzo stato: a quel punto la
    migrazione va fatta comunque.

hard_stop_considered:
  what: "Portare active a uno status enum eliminando la colonna"
  why_not: >
    AUTONOMOUS_CHARTER.md hard stop 3 riguarda una migrazione distruttiva
    SENZA alternativa ragionevole. L'alternativa esiste e funziona: il
    ciclo di vita gira identico su un booleano e nessuna regola di dominio
    cambia. Quindi non serve fermarsi a chiedere, serve non farlo.
    Registrato come TD-31.

