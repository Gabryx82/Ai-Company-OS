task: TASK-009
title: Assegnazione Task -> Agent
mode: implementation
status: SELF_APPROVED
approval: autonomous_project_mode
decided_on: 2026-09-17

selection_rationale: >
  AUTONOMOUS_LOOP.md sezione 4, livello 4. Il livello 3 si e' svuotato quando
  TASK-008 ha chiuso TD-28 e TD-30. Agent e' un registro senza relazioni, e
  Planner, Subagents, Model Gateway e la sostituzione di MasterOrchestrator
  poggiano tutti sul fatto che il sistema oggi non sa esprimere: chi lavora su
  che cosa.

