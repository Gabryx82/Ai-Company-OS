  - merge_to_master
  - push

debt_accounting_at_close:
  TD-13: "RESOLVED (numerazione dell'audit): Agent e Task adesso si conoscono"
  TD-34: >
    OPEN nuovo, MINOR. Un task puo' puntare a un agente inattivo -- stato legale
    e necessario per D3 -- e non c'e' modo di chiedere "i task fermi su agenti
    inattivi" senza incrociare due liste lato client.
  TD-35: >
    OPEN nuovo, MINOR. Nessun DELETE dell'associazione: un task assegnato non
    torna non assegnato, si riassegna soltanto. Gemello di quello che ADR-005
    sezione 5 lascio' aperto sul progetto, con piu' pressione.

