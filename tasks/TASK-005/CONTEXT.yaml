invariants:
  - "ogni risposta di errore e' un ProblemDetail con type, title, status, detail"
  - "il type e' stabile ed enumerato: nessun handler ne inventa uno"
  - "due problemi diversi non condividono uno slug"
  - "nessuno stato HTTP cambia: cambiano solo i corpi"
  - "il detail di un 500 non contiene nulla dell'eccezione interna"
  - "ogni eccezione di dominio dichiarata ha una mappatura"
  - "schema fermo a V3: nessuna migrazione"
  - "nessuna policy di timeout, retry o 503 (ADR-006 sezione 7 resta valida)"
  - "protocollo di lock L0-L7 invariato"

supersedes:
  - "ADR-004 sezione 6: contratto di errore limitato al modulo project"
  - "ADR-005 sezione 8: advice limitato alle eccezioni di TASK-003"

breaking_change_declared: >
  I corpi di errore di /api/agents e delle risposte preesistenti di
  /api/tasks cambiano forma. Nessuno stato HTTP cambia. E' il lavoro della
  task, non un effetto collaterale.

