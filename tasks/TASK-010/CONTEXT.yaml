task: TASK-010
title: Vocabolario chiuso di Task.status
mode: implementation
status: SELF_APPROVED
approval: autonomous_project_mode
decided_on: 2026-09-19

selection_rationale: >
  AUTONOMOUS_LOOP.md sezione 4, livello 5. Livelli 1, 2 e 3 vuoti alla chiusura
  di TASK-009 e riletti sul posto: 201/201 verdi, nessun failure aperto, TD-28 e
  TD-30 chiusi da TASK-008. Un task sa dove sta (TASK-003) e di chi e'
  (TASK-009); non sa in che stato e' in un modo verificabile. TD-12 e' il
  prerequisito di TD-08 e del Planner, non il contrario.

scope_boundary: >
  TD-12 copre status E priority. Questa task chiude SOLO status, per istruzione
  esplicita e perche' priority e' una normalizzazione adiacente, non la stessa.
  TD-12 resta parzialmente aperto come TD-36.

baseline:
  branch: task-010-task-status-vocabulary
  base: autonomous/phase-2-assignment
  head_at_start: 51586b2
  suite_at_start: 201
  schema_at_start: V6
  working_tree_at_start: clean

