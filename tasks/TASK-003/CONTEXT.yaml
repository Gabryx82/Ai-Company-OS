files_in_play:
  - backend/src/main/java/com/aicompany/backend/task/**
  - backend/src/main/java/com/aicompany/backend/project/**
  - backend/src/main/resources/db/migration/**
  - backend/src/test/**

writes_allowed:
  - backend/src/main/java/com/aicompany/backend/task/**
  - backend/src/main/resources/db/migration/V3__add_task_project_relation.sql
  - backend/src/test/**
  - docs/adr/**
  - tasks/TASK-003/**
  - .company-os/PROJECT_STATE.md

invariants:
  - "PostgreSQL + Flyway, schema di proprieta di Flyway"
  - "spring.jpa.hibernate.ddl-auto=validate"
  - "seed dev in stream Flyway separato (ADR-003)"
  - "POST /api/tasks valido -> 201 + Location; {} -> 400 con la forma di errore preesistente"
  - "nessun H2"
  - "V3 additiva: nessuna UPDATE sui dati esistenti"
  - "archive/restore di un progetto non tocca i suoi task"
  - "entita Project invariata"

decisions_required_before_implementation:
  - id: nullable
    question: "project_id deve essere nullable in questa fase?"
    answer: "Si. Nessun valore corretto esiste per le righe preesistenti, e un progetto sintetico di backfill sarebbe un workaround permanente. ADR-005 §1"
  - id: existing_rows
    question: "Come migrare i Task gia esistenti?"
    answer: "Non si migrano. Restano project_id NULL, stato esplicito nel contratto e recuperabile via PUT /api/tasks/{id}/project. ADR-005 §2"
  - id: archived_target
    question: "Cosa accade associando un Task a un Project ARCHIVED?"
    answer: "409. Un contenitore fuori dal registro operativo non riceve lavoro nuovo. Reversibile dal chiamante con restore. ADR-005 §3"

forbidden:
  - cascade_archive_restore_to_tasks
  - automatic_deletion
  - td_19_concurrency_control
  - task_domain_enums
  - planner
  - agent_assignment
  - graph_orchestration
  - global_exception_handler
  - frontend
  - python_ai_service
  - authentication
  - stack_change
