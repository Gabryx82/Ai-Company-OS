    la maggior parte degli identificatori coincide, quindi chi ne verifica due o
    tre conclude che il problema non esista.

running_md_false_statements:
  - claim: "La prossima migrazione di schema si chiama V2__...sql"
    reality: "lo stream e' a V7; una V2 nuova viene rifiutata da Flyway"
    severity: "istruisce a sbagliare, non solo incompleta"
  - claim: "Dopo la transizione deve contenere solo 1 | V1__create_agents_and_tasks.sql"
    reality: "vero appena dopo TASK-001A, falso da V2 in poi"
    fix: "cio' che si verifica e' l'ASSENZA della riga legacy 1000"
  missing_entirely: >
    che ogni mutazione richiede If-Match. Senza, il primo PUT di chiunque
    fallisce con 428 in modo incomprensibile.
  endpoints_documented_before: 3
  endpoints_documented_after: 18

decisions:
  no_renumbering:
    live: "romperebbe ogni riferimento in ADR, artefatti e commit"
    audit: "riscriverebbe cio' che TASK-000 osservo'; uno snapshot che si aggiorna non e' uno snapshot"
    chosen: "additivo: la collisione si rende interpretabile, non si cancella"
  audit_debts_not_closed: >
    otto debiti esistono solo nell'audit e diversi sono con ogni evidenza
    risolti. NON dichiarati chiusi: "con ogni evidenza risolto" E' "il codice
    sembra diverso", che il charter vieta. Il registro dice "non rivalutato
    qui", che e' vero, e registra la rivalutazione come task successiva.
  test_for_a_docs_problem: >
    il charter chiede una verifica che fallisca se il difetto torna. Il difetto
    torna quando esiste un id dell'audit di cui il registro non rende conto.

invariants:
  - "I-1: ogni TD-NN dell'audit compare nel registro"
  - "I-2: il registro dichiara quale spazio e' autoritativo e i due significati delle cinque collisioni"
  - "I-3: il test fallisce, non salta, se non trova i file"
  - "I-4: RUNNING.md non contiene istruzioni false"
  - "I-5: ogni endpoint dei controller compare in RUNNING.md"
  - "I-6: nessuna modifica al codice applicativo"

forbidden:
