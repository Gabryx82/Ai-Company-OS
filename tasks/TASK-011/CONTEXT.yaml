task: TASK-011
title: Registro del debito e documentazione operativa
mode: implementation
status: SELF_APPROVED
approval: autonomous_project_mode
decided_on: 2026-09-19

selection_rationale: >
  AUTONOMOUS_LOOP.md sezione 4, livello 6 -- e la scelta va argomentata perche'
  il criterio a prima vista dice il contrario. Il livello 5 NON e' vuoto:
  TASK-010 ha aperto TD-37 (le transizioni di status). TD-37 resta comunque
  fuori da PHASE 2 per due ragioni: la fase si chiama Assignment e non
  Lifecycle, quindi introdurre le transizioni allargherebbe lo scope di una fase
  in corso (charter sezione 4); e PHASE_2_PLAN sezione 4 condizione 3 non e'
  soddisfatta, perche' chiede un FINAL_HANDOFF aggiornato e quello che esiste e'
  di PHASE 1. Charter sezione 8: a fine fase si prepara quel documento e ci si
  ferma. TD-37 e' il primo candidato di PHASE 3, accanto a TD-04.

