key_technical_point: >
  Il controllo automatico di @Version non scatta mai sui nostri write path.
  JPA confronta la versione caricata nel persistence context con quella nel
  database al flush; l'entita' e' caricata con PESSIMISTIC_WRITE, e sotto
  READ COMMITTED un SELECT ... FOR UPDATE che ha atteso rilegge l'ultima
  versione committata. Carica gia' N+1, scrive N+1 -> N+2, le versioni
  coincidono, nessuna eccezione. Il lock ha reso il controllo ottimistico
  banalmente soddisfatto. La rilevazione deve quindi confrontare cio' che il
  CLIENT ha visto con cio' che c'e' adesso, dopo il lock e prima delle guardie.

invariants:
  - "I-1: mutazione senza If-Match -> 428, e nulla cambia"
  - "I-2: mutazione con If-Match stantio -> 412, e nulla cambia"
  - "I-3: la precondizione precede il no-op idempotente"
  - "I-4: due riassegnazioni concorrenti con lo stesso ETag -> un 200 e un 412, mai due 200"
  - "I-5: la versione di una riga cambia solo quando quella riga viene scritta"
  - "I-6: un no-op non incrementa la versione"
  - "I-7: l'ETag di una mutazione e' quello che la GET successiva restituisce"
  - "I-8: V5 additiva, nessuna riga persa, righe preesistenti a version = 0"
  - "I-9: If-Match: * rifiutato con 400"
  - "I-10: ogni type nuovo enumerato in ApiProblem"
  - "I-11: il protocollo di lock di ADR-006 non si indebolisce"

protocol_P:
  P0: "ogni mutazione di risorsa esistente richiede If-Match; assente -> 428"
  P1: "precondizione valutata in transazione, dopo il lock esclusivo, prima di ogni guardia"
  P2: "precondizione valutata prima di ogni scorciatoia idempotente"
  P3: "la versione e' il contatore della propria riga e di nessun'altra; OPTIMISTIC_FORCE_INCREMENT vietato"
  P4: "clausola di chiusura: ogni write path futuro eredita P0-P3, TASK-009 incluso"

