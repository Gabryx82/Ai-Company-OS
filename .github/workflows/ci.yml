# TD-14 — the continuous integration this repository has never had.
#
# It runs the real build and the real suite: `./mvnw -B clean test` in backend/,
# which is the same command PROJECT_STATE.md quotes and the same one every task
# has been verified with locally. Nothing is stubbed, skipped or reduced.
#
# WHY THERE IS NO `services: postgres` BLOCK
#
# That is the obvious thing to add to a workflow for a project whose tests need
# PostgreSQL, and here it would be wrong: nothing would ever connect to it.
#
# The suite does not take a database from the environment. It starts its own,
# through Testcontainers -- see PostgresTestcontainerConfig, which declares a
# PostgreSQLContainer on postgres:17-alpine, and MigrationStreamTest, which
# drives Flyway against schemas inside a container of its own. A service
# container would sit there unused while Testcontainers started the real one,
# and the workflow would be documenting a dependency the code does not have.
#
# What the tests actually need is a Docker daemon, which GitHub's ubuntu-latest
# runners provide. That dependency is real, and the step below makes it visible
# rather than implicit: without it, a runner missing Docker fails deep inside
# Testcontainers with a message that does not name the cause.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow reads the repository and writes nothing.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    # The suite runs ~1 minute locally and spends most of it waiting on
    # containers. This is a stuck-run guard, not a performance target.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Matches <java.version>21</java.version> in backend/pom.xml. Spring
          # Boot 4.1 requires 17 or later; the project declares 21 and the CI
          # must not silently run on something else.
          java-version: '21'
          distribution: 'temurin'
          # Keyed on the POM by the action itself, so a dependency change
          # invalidates it and an unchanged build reuses it.
          cache: 'maven'

      - name: Confirm Docker is available
        # Testcontainers needs a daemon, and this is the only environmental
        # dependency the suite has. Asserting it here turns "no Docker" into one
        # readable line instead of a stack trace inside a test.
        run: |
          docker version
          docker info --format 'Docker server {{.ServerVersion}}'

      - name: Build and run the full test suite
        working-directory: backend
        # -B is batch mode: no ANSI progress spinners in the log.
        # clean, so nothing is inherited from a cached target/ directory.
        run: ./mvnw -B clean test

      - name: Upload surefire reports
        # Also on failure -- especially on failure, which is when the XML is the
        # only way to see which test failed and why without re-running anything.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  # PHASE 5 (ADR-015). The AI Engine's suite, on its own runner: the two services
  # share no build and no dependency, and one failing must not hide the other.
  # No provider is reached -- Ollama and Anthropic are exercised through mock
  # transports -- so this job needs no network beyond pip and no secret at all.
  ai-engine:
    name: AI Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest

  # PHASE 7 (ADR-017). The operator console: its types must be the ones the
  # committed OpenAPI description produces, and then it must typecheck, pass its
  # tests and build. No backend runs here -- the tests use a fake fetch.
  frontend:
    name: Operator console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types match the committed contract
        # docs/api/openapi.json is held to the server by OpenApiContractTest;
        # this holds the console's types to that file. Together: no silent drift.
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
