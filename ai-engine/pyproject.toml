[project]
name = "aicos-ai-engine"
version = "0.1.0"
description = "AI Company OS — AI Engine: the model gateway of ADR-001 / ADR-015"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "anthropic>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
