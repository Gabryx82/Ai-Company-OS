# Tests run against a throwaway PostgreSQL container provided by Testcontainers.
# Only the schema stream is applied here: the development seed is a separate
# Flyway stream, applied by a dev-profile-only bean, so it cannot make
# assertions pass by accident.
spring.flyway.locations=classpath:db/migration

# TASK-013. The one credential the suite authenticates with. A fixed test value,
# not a secret: it exists only inside the throwaway container's application
# context. AuthenticatedMockMvcConfiguration sends it on every request of the
# shared MockMvc, so tests that are not about authentication stay about what
# they were about.
aicos.security.api-tokens.operator=test-operator-token-0123456789

# TASK-014. The one origin the suite's browser client pretends to come from.
aicos.cors.allowed-origins=http://console.test

# TASK-019. The scripted engine replaces the HTTP client in every Spring test;
# the HTTP client bean is still built, so it needs a token of the right shape.
aicos.engine.token=test-engine-token-0123456789
aicos.engine.url=http://127.0.0.1:9

# PHASE 8. The real launcher is off (the FakeHost records launches instead), and
# the local usage sources point at folders that do not exist: no test reads the
# developer's own Claude Code or Codex logs.
aicos.launcher.enabled=false
aicos.usage.codex-home=${java.io.tmpdir}/aicos-test-no-codex
aicos.usage.claude-home=${java.io.tmpdir}/aicos-test-no-claude
aicos.usage.antigravity-home=${java.io.tmpdir}/aicos-test-no-antigravity
aicos.usage.antigravity-ide-home=${java.io.tmpdir}/aicos-test-no-antigravity-ide
aicos.usage.kimi-code-api-key=

# PHASE 9. Project workspaces of the tests live in the temporary folder.
aicos.workspace.root=${java.io.tmpdir}/aicos-test-workspaces

# PHASE 15 (ADR-024). The admin the security tests sign in as, and a home that is
# never the developer's own ~/.aicos. The default test client stays an OPERATOR
# service token: admin-only routes are exercised by signing in.
aicos.home=${java.io.tmpdir}/aicos-test-home
aicos.security.admin.username=admin
aicos.security.admin.password=test-root-secret-0123
aicos.security.login.attempts-per-minute=1000

# PHASE 21 (ADR-028). The ecosystem is started by tests explicitly, never at startup.
aicos.ecosystem.autostart=false
aicos.ecosystem.poll-millis=20

# PHASE 31 (ADR-036). The Knowledge Hub reads the applications' skill folders
# below a fake home and a fake roaming folder -- never the developer's own
# ~/.claude, ~/.codex or %APPDATA%\Claude -- and its schedule is off: tests sync
# when they say so. The marketplaces are a FakeHubWeb (FakeHostConfiguration).
aicos.hub.home=${java.io.tmpdir}/aicos-test-hub-home
aicos.hub.app-data=${java.io.tmpdir}/aicos-test-hub-appdata
aicos.hub.sync-interval=PT0S
aicos.hub.local-app-data=${java.io.tmpdir}/aicos-test-hub-localappdata
# PHASE 31: connectors are launched as on Windows (npx through cmd /c) on every runner.
aicos.hub.windows=true
