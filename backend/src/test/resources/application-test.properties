# Tests run against a throwaway PostgreSQL container provided by Testcontainers.
# Only the schema stream is applied here: the development seed is a separate
# Flyway stream, applied by a dev-profile-only bean, so it cannot make
# assertions pass by accident.
spring.flyway.locations=classpath:db/migration

# TASK-013. The one credential the suite authenticates with. A fixed test value,
# not a secret: it exists only inside the throwaway container's application
# context. AuthenticatedMockMvcConfiguration sends it on every request of the
# shared MockMvc, so tests that are not about authentication stay about what
# they were about.
aicos.security.api-tokens.operator=test-operator-token-0123456789

# TASK-014. The one origin the suite's browser client pretends to come from.
aicos.cors.allowed-origins=http://console.test
