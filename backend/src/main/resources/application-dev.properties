# Local development against the PostgreSQL instance started by docker-compose.yml.
# Defaults match .env.example and are local-only values, not production credentials.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aicompany}
spring.datasource.username=${POSTGRES_USER:aicompany}
spring.datasource.password=${POSTGRES_PASSWORD:aicompany_local_dev}

# spring.flyway.locations is intentionally NOT overridden here.
#
# The schema stream (classpath:db/migration) is the same in every profile, so a
# development database follows exactly the same schema history as production.
# The development seed is a second, independent Flyway stream with its own
# history table, applied by DevSeedFlywayConfiguration, which is active only
# under this profile. Merging the two streams is what broke future migrations in
# TASK-001 (Codex review, R1).

# TASK-013 (ADR-013). The operator's bearer token. Overridable from the
# environment (AICOS_OPERATOR_TOKEN); the default is a local-development value
# with the same standing as the database password above -- it protects a
# process bound to loopback on a developer machine, and it says "change me" so
# that nobody mistakes it for anything else.
aicos.security.api-tokens.operator=${AICOS_OPERATOR_TOKEN:dev-operator-token-change-me}
