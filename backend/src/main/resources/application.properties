spring.application.name=backend

# No profile given on the command line means local development.
spring.profiles.default=dev

# The schema is owned by Flyway. Hibernate must validate it and never alter it:
# a mismatch between entities and migrations has to fail the startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# TASK-013 (ADR-013). Only the liveness probe is exposed, and it says UP or DOWN
# and nothing else: no components, no details, no version. It is the one route
# that answers without a credential, so it must not become an inventory.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
