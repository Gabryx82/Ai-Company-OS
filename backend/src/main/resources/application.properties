spring.application.name=backend

# PHASE 8 (ADR-019 §5). 8081, not Spring's 8080: Open WebUI -- a member of the
# same ecosystem, embedded in the console -- listens on 127.0.0.1:8080 on the
# operator's machine, and the side we control is ours.
server.port=${SERVER_PORT:8081}

# No profile given on the command line means local development.
spring.profiles.default=dev

# The schema is owned by Flyway. Hibernate must validate it and never alter it:
# a mismatch between entities and migrations has to fail the startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# PHASE 32 (TD-60): statements of the same shape go to the database in batches of 50.
# Only entities with sequence ids (the Blueprint's nodes and edges) can batch their
# inserts; updates are not reordered, so the order in which rows are written -- and
# locked -- is still the order of the code.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# TASK-013 (ADR-013). Only the liveness probe is exposed, and it says UP or DOWN
# and nothing else: no components, no details, no version. It is the one route
# that answers without a credential, so it must not become an inventory.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# PHASE 27 (ADR-024). People are app_users; Spring Boot's default in-memory user
# would otherwise be created and its generated password printed to the log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# PHASE 32 (TD-79). The Knowledge Hub asks the GitHub API anonymously (60 requests an
# hour). A token -- AICOS_GITHUB_TOKEN in %USERPROFILE%\.aicos\local.env, read-only,
# no scope needed for public repositories -- raises it to 5000. It is sent to
# api.github.com only, and never written anywhere.
aicos.hub.github-token=${AICOS_GITHUB_TOKEN:}
# PHASE 33 (ADR-038). Kimi Code's quota is asked to Kimi with the operator's own Kimi
# Code key -- AICOS_KIMI_CODE_API_KEY in %USERPROFILE%\.aicos\local.env, created in the
# Kimi Code console. Empty, the usage view says how to add it and asks nothing. Sent
# only to the base URL below, never written anywhere.
aicos.usage.kimi-code-api-key=${AICOS_KIMI_CODE_API_KEY:}
aicos.usage.kimi-code-base-url=https://api.kimi.com/coding/v1
