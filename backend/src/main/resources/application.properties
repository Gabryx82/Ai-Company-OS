spring.application.name=backend

# PHASE 8 (ADR-019 §5). 8081, not Spring's 8080: Open WebUI -- a member of the
# same ecosystem, embedded in the console -- listens on 127.0.0.1:8080 on the
# operator's machine, and the side we control is ours.
server.port=${SERVER_PORT:8081}

# No profile given on the command line means local development.
spring.profiles.default=dev

# The schema is owned by Flyway. Hibernate must validate it and never alter it:
# a mismatch between entities and migrations has to fail the startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# TASK-013 (ADR-013). Only the liveness probe is exposed, and it says UP or DOWN
# and nothing else: no components, no details, no version. It is the one route
# that answers without a credential, so it must not become an inventory.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# PHASE 27 (ADR-024). People are app_users; Spring Boot's default in-memory user
# would otherwise be created and its generated password printed to the log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
