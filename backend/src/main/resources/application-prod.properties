# Production takes every connection value from the environment.
# No defaults on purpose: a missing variable must fail the startup rather than
# silently connect somewhere unintended.
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Schema migrations only, exactly as in the common configuration. The
# development seed lives in a separate Flyway stream whose history table this
# profile never reads or writes, so production is unaffected by whether a
# database was ever seeded.
#
# Note: this is a separation of concerns, not a security boundary. It does not
# by itself prevent someone from pointing prod at a development database; see
# docs/RUNNING.md.
spring.flyway.locations=classpath:db/migration

# TASK-013 (ADR-013), narrowed by PHASE 15 (ADR-024): the service token is
# optional -- people sign in -- and has no default.
aicos.security.api-tokens.operator=${AICOS_OPERATOR_TOKEN:}

# PHASE 15 (ADR-024). The first admin: AICOS_ADMIN_PASSWORD, or a generated
# password written under AICOS_HOME. Nothing secret has a default here.
aicos.home=${AICOS_HOME:${user.home}/.aicos}
aicos.security.admin.username=${AICOS_ADMIN_USERNAME:admin}
aicos.security.admin.password=${AICOS_ADMIN_PASSWORD:}
aicos.security.admin.reset=${AICOS_ADMIN_RESET:false}

# TASK-019 (ADR-016). No defaults: without them the application does not start.
aicos.engine.url=${AICOS_ENGINE_URL}
aicos.engine.token=${AICOS_ENGINE_TOKEN}

# TASK-014 (TD-11). No browser origin unless one is declared: a console nobody
# configured is a console that does not exist.
aicos.cors.allowed-origins=${AICOS_CORS_ALLOWED_ORIGINS:}

# PHASE 27. The OpenAPI document is a development aid (docs/api/openapi.json is
# the contract); production does not serve it.
springdoc.api-docs.enabled=false
